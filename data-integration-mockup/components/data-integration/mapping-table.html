<div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b border-gray-200">
                <tr>
                    <th scope="col" class="px-6 py-4 w-[40%] font-semibold">Trường Dữ Liệu Nguồn <span class="text-gray-400 font-normal lowercase ml-1">(Oracle)</span></th>
                    <th scope="col" class="px-4 py-4 w-[15%] text-center font-semibold">Quy tắc (Transform)</th>
                    <th scope="col" class="px-6 py-4 w-[40%] font-semibold">Trường Dữ Liệu Đích <span class="text-gray-400 font-normal lowercase ml-1">(PostgreSQL)</span></th>
                    <th scope="col" class="px-4 py-4 w-[5%] text-center"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <!-- Dòng Mapping 1 -->
                <tr class="hover:bg-blue-50/50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-red-50 border border-red-100 text-red-600 p-1.5 rounded-md shadow-sm"><i data-lucide="database" class="w-4 h-4"></i></span>
                            <div class="flex flex-col">
                                <span class="font-mono text-gray-800 font-bold">emp_id</span>
                                <span class="text-[11px] text-gray-500 uppercase tracking-wider">VARCHAR(20)</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-4 text-center">
                        <div class="flex flex-col items-center gap-1.5">
                            <select class="text-xs border-gray-300 rounded-md shadow-sm focus:border-primary-500 focus:ring-primary-500 p-1.5 w-28 bg-white cursor-pointer">
                                <option value="none">Trực tiếp</option>
                                <option value="to_number" selected>Ép kiểu số (To Number)</option>
                                <option value="trim">Cắt khoảng trắng (Trim)</option>
                            </select>
                            <i data-lucide="arrow-right" class="w-5 h-5 text-primary-500 animate-pulse"></i>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-blue-50 border border-blue-100 text-blue-600 p-1.5 rounded-md shadow-sm"><i data-lucide="server" class="w-4 h-4"></i></span>
                            <select class="text-sm font-mono border-gray-300 rounded-md shadow-sm focus:border-primary-500 focus:ring-primary-500 p-2 w-full bg-white cursor-pointer">
                                <option>id (INT8)</option>
                                <option>employee_id (VARCHAR)</option>
                            </select>
                        </div>
                    </td>
                    <td class="px-4 py-4 text-center">
                        <button class="text-gray-400 hover:text-error-600 hover:bg-error-50 p-2 rounded-md transition-colors" title="Xóa mapping"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>
                
                <!-- Dòng Mapping 2 -->
                <tr class="hover:bg-blue-50/50 transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-red-50 border border-red-100 text-red-600 p-1.5 rounded-md shadow-sm"><i data-lucide="database" class="w-4 h-4"></i></span>
                            <div class="flex flex-col">
                                <span class="font-mono text-gray-800 font-bold">full_name</span>
                                <span class="text-[11px] text-gray-500 uppercase tracking-wider">VARCHAR(100)</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-4 text-center">
                        <div class="flex flex-col items-center gap-1.5">
                            <select class="text-xs border-gray-300 rounded-md shadow-sm focus:border-primary-500 focus:ring-primary-500 p-1.5 w-28 bg-white cursor-pointer">
                                <option value="none">Trực tiếp</option>
                                <option value="uppercase">In hoa (UPPERCASE)</option>
                            </select>
                            <i data-lucide="arrow-right" class="w-5 h-5 text-gray-300"></i>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <span class="bg-blue-50 border border-blue-100 text-blue-600 p-1.5 rounded-md shadow-sm"><i data-lucide="server" class="w-4 h-4"></i></span>
                            <select class="text-sm font-mono border-gray-300 rounded-md shadow-sm focus:border-primary-500 focus:ring-primary-500 p-2 w-full bg-white cursor-pointer">
                                <option>name (VARCHAR)</option>
                            </select>
                        </div>
                    </td>
                    <td class="px-4 py-4 text-center">
                        <button class="text-gray-400 hover:text-error-600 hover:bg-error-50 p-2 rounded-md transition-colors" title="Xóa mapping"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-center">
        <button class="flex items-center justify-center gap-2 text-sm font-medium text-primary-600 hover:text-primary-700 hover:bg-primary-50 px-4 py-2.5 rounded-md transition-colors border border-dashed border-primary-300 w-full max-w-sm">
            <i data-lucide="plus" class="w-4 h-4"></i> Thêm trường mapping (Map Field)
        </button>
    </div>
</div>
