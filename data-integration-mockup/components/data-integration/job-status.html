<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 hover:shadow-md transition-shadow relative overflow-hidden group">
    <!-- Top Progress Bar (if running) -->
    <div class="absolute top-0 left-0 h-1 bg-gray-100 w-full">
        <div class="h-1 bg-primary-500 w-[65%] animate-pulse"></div>
    </div>

    <div class="flex justify-between items-start mb-4 mt-2">
        <div>
            <div class="flex items-center gap-2.5 mb-1.5">
                <h3 class="font-bold text-gray-800 text-lg group-hover:text-primary-600 transition-colors">Sync_HR_to_DataLake</h3>
                <span class="bg-purple-100 text-purple-700 border border-purple-200 text-[10px] uppercase font-bold px-2 py-0.5 rounded-md">CDC</span>
            </div>
            <p class="text-sm text-gray-500 flex items-center gap-1.5">
                <i data-lucide="clock" class="w-4 h-4 text-gray-400"></i> Chạy mỗi 5 phút
            </p>
        </div>
        
        <!-- Status Badge -->
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-primary-50 text-primary-700 border border-primary-200">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-500 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-primary-500"></span>
            </span>
            Đang chạy (65%)
        </span>
    </div>
    
    <!-- Stats Grid -->
    <div class="grid grid-cols-2 gap-4 my-5 p-4 bg-gray-50 rounded-lg border border-gray-100">
        <div>
            <p class="text-xs text-gray-500 mb-1.5 font-medium uppercase tracking-wide">Lần chạy cuối</p>
            <p class="text-sm font-bold text-gray-800">10:05:00 20/05</p>
        </div>
        <div>
            <p class="text-xs text-gray-500 mb-1.5 font-medium uppercase tracking-wide">Số bản ghi xử lý</p>
            <p class="text-sm font-bold text-gray-800">14,592</p>
        </div>
    </div>

    <!-- Mini Chart (7 days) -->
    <div class="mb-5">
        <div class="flex items-center justify-between mb-2">
            <p class="text-xs text-gray-500 font-medium flex items-center gap-1.5">
                <i data-lucide="bar-chart-2" class="w-4 h-4 text-gray-400"></i> Tần suất 7 ngày qua
            </p>
            <span class="text-[10px] text-gray-400">Thành công: 98%</span>
        </div>
        <div class="flex items-end gap-1.5 h-10 w-full">
            <div class="flex-1 bg-success-400 rounded-sm h-full hover:bg-success-500 transition-colors cursor-pointer" title="Thành công"></div>
            <div class="flex-1 bg-success-400 rounded-sm h-[85%] hover:bg-success-500 transition-colors cursor-pointer" title="Thành công"></div>
            <div class="flex-1 bg-success-400 rounded-sm h-[95%] hover:bg-success-500 transition-colors cursor-pointer" title="Thành công"></div>
            <div class="flex-1 bg-error-400 rounded-sm h-[30%] hover:bg-error-500 transition-colors cursor-pointer" title="Thất bại (2 lỗi)"></div>
            <div class="flex-1 bg-success-400 rounded-sm h-full hover:bg-success-500 transition-colors cursor-pointer" title="Thành công"></div>
            <div class="flex-1 bg-success-400 rounded-sm h-[90%] hover:bg-success-500 transition-colors cursor-pointer" title="Thành công"></div>
            <div class="flex-1 bg-primary-400 rounded-sm h-[65%] animate-pulse cursor-pointer" title="Đang chạy (Hôm nay)"></div>
        </div>
    </div>
    
    <!-- Actions -->
    <div class="flex items-center justify-between border-t border-gray-100 pt-4">
        <div class="flex gap-2">
            <button class="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-error-700 bg-error-50 hover:bg-error-100 border border-error-200 rounded-md transition-colors" title="Dừng luồng dữ liệu">
                <i data-lucide="square" class="w-3.5 h-3.5 fill-current"></i> Dừng
            </button>
            <button class="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-gray-600 bg-white hover:bg-gray-50 border border-gray-200 rounded-md transition-colors" title="Chạy lập tức">
                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Chạy lại
            </button>
        </div>
        <button class="text-sm font-semibold text-primary-600 hover:text-primary-700 hover:bg-primary-50 px-2 py-1.5 rounded flex items-center gap-1.5 transition-colors">
            Xem logs <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
    </div>
</div>
