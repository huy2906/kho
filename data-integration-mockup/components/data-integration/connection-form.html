<div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-white border border-gray-200 flex items-center justify-center">
            <i data-lucide="cable" class="w-5 h-5 text-primary-600"></i>
        </div>
        <h2 class="text-lg font-bold text-gray-800">Cấu hình Kết nối CSDL</h2>
    </div>
    
    <form class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-y-6 gap-x-8 mb-8">
            <!-- Loại CSDL -->
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Loại Cơ sở dữ liệu <span class="text-error-600">*</span></label>
                <div class="relative">
                    <select class="block w-full pl-3 pr-10 py-2.5 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-lg border appearance-none bg-white shadow-sm cursor-pointer">
                        <option value="" disabled selected>Chọn hệ quản trị CSDL (RDBMS/NoSQL)</option>
                        <option value="oracle">Oracle Database</option>
                        <option value="sqlserver">Microsoft SQL Server</option>
                        <option value="mysql">MySQL</option>
                        <option value="postgres">PostgreSQL</option>
                        <option value="mongodb">MongoDB</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <!-- Tên kết nối -->
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tên kết nối (Hiển thị) <span class="text-error-600">*</span></label>
                <input type="text" class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-shadow" placeholder="VD: DB_NhanSu_Oracle_19c">
            </div>

            <!-- Host -->
            <div class="col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Host / IP Address <span class="text-error-600">*</span></label>
                <input type="text" class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm font-mono transition-shadow" placeholder="192.168.x.x hoặc hostname">
            </div>

            <!-- Port -->
            <div class="col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Port <span class="text-error-600">*</span></label>
                <input type="number" class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm font-mono transition-shadow" placeholder="VD: 1521">
            </div>

            <!-- Database Name / SID -->
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Database Name / SID <span class="text-error-600">*</span></label>
                <input type="text" class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm font-mono transition-shadow" placeholder="Nhập tên CSDL hoặc SID">
            </div>

            <!-- Username -->
            <div class="col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Tài khoản (Username) <span class="text-error-600">*</span></label>
                <input type="text" class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-shadow" autocomplete="off" placeholder="Nhập username">
            </div>

            <!-- Password -->
            <div class="col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-1.5">Mật khẩu <span class="text-error-600">*</span></label>
                <div class="relative">
                    <input type="password" class="block w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-shadow" autocomplete="new-password" placeholder="••••••••">
                    <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                        <i data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Advanced Settings -->
        <div class="border border-gray-200 rounded-lg overflow-hidden mb-6">
            <button type="button" class="w-full px-5 py-3.5 bg-gray-50 flex items-center justify-between text-sm font-bold text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none">
                <div class="flex items-center gap-2">
                    <i data-lucide="settings-2" class="w-5 h-5 text-gray-500"></i>
                    Cấu hình nâng cao (Tùy chọn)
                </div>
                <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
            </button>
            <!-- Nút bấm ẩn hiện ở mockup chỉ demo HTML -->
            <div class="p-5 border-t border-gray-200 bg-white grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex items-center justify-between col-span-1 md:col-span-2 bg-slate-50 p-4 rounded-lg border border-slate-100">
                    <div>
                        <span class="block text-sm text-gray-800 font-bold mb-0.5">Sử dụng SSL/TLS</span>
                        <span class="block text-xs text-gray-500">Mã hóa dữ liệu truyền tải giữa hệ thống và CSDL</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" value="" class="sr-only peer">
                      <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-600"></div>
                    </label>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Connection Timeout (ms)</label>
                    <input type="number" value="30000" class="block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm sm:text-sm font-mono focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Max Pool Size</label>
                    <input type="number" value="10" class="block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm sm:text-sm font-mono focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-6 border-t border-gray-200">
            <button type="button" class="inline-flex items-center px-4 py-2.5 border border-gray-300 shadow-sm text-sm font-bold rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors gap-2">
                <i data-lucide="plug" class="w-4 h-4 text-gray-500"></i>
                Test Kết Nối
            </button>
            
            <div class="flex gap-3">
                <button type="button" class="inline-flex items-center px-4 py-2.5 border border-transparent text-sm font-bold rounded-lg text-gray-600 hover:text-gray-800 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors">
                    Hủy bỏ
                </button>
                <button type="submit" class="inline-flex items-center px-6 py-2.5 border border-transparent text-sm font-bold rounded-lg shadow-sm text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    Lưu cấu hình
                </button>
            </div>
        </div>
    </form>
</div>
