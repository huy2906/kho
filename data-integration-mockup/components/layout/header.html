<div class="h-1 bg-flag-red w-full fixed top-0 left-0 z-50"></div>
<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-40 w-full mt-1">
    <!-- Left: Logo & Title -->
    <div class="flex items-center gap-3">
        <!-- Placeholder cho Logo -->
        <div class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center border border-primary-200 text-primary-600">
            <i data-lucide="shield" class="w-5 h-5"></i>
        </div>
        <h1 class="text-lg font-bold text-gray-800 hidden md:block">Hệ thống Quản trị Tích hợp Dữ liệu - Cơ quan ABC</h1>
    </div>
    
    <!-- Center: Global Search -->
    <div class="flex-1 max-w-xl px-8 hidden lg:block">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="search" class="h-4 w-4 text-gray-400"></i>
            </div>
            <input type="text" class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-primary-500 focus:ring-1 focus:ring-primary-500 sm:text-sm transition-colors duration-200" placeholder="Tìm kiếm CSDL, job, API, bảng dữ liệu...">
            <div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                <span class="text-xs text-gray-400 border border-gray-200 rounded px-1.5 py-0.5 bg-white">Ctrl+K</span>
            </div>
        </div>
    </div>

    <!-- Right: Notifications & Profile -->
    <div class="flex items-center gap-4">
        <button class="relative p-2 text-gray-500 hover:text-primary-600 transition-colors rounded-full hover:bg-gray-100">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-1.5 right-1.5 block h-2 w-2 rounded-full bg-flag-red ring-2 ring-white"></span>
        </button>
        
        <div class="relative flex items-center gap-2 cursor-pointer p-1 rounded-md hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-200 group">
            <div class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center text-primary-700 font-medium border border-primary-200">
                AD
            </div>
            <div class="hidden md:flex flex-col">
                <span class="text-sm font-medium text-gray-700 leading-tight">Admin User</span>
                <span class="text-xs text-gray-500">Quản trị viên</span>
            </div>
            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition-colors"></i>
            
            <!-- Dropdown Menu (mockup, use JS to toggle in real app) -->
            <div class="absolute right-0 top-full mt-1 w-48 bg-white rounded-md shadow-lg py-1 ring-1 ring-black ring-opacity-5 hidden group-hover:block border border-gray-200">
                <a href="#" class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-2">
                    <i data-lucide="user" class="w-4 h-4 text-gray-400"></i> Hồ sơ
                </a>
                <a href="#" class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center gap-2">
                    <i data-lucide="key" class="w-4 h-4 text-gray-400"></i> Đổi mật khẩu
                </a>
                <div class="border-t border-gray-100 my-1"></div>
                <a href="#" class="px-4 py-2 text-sm text-error-600 hover:bg-error-50 flex items-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Đăng xuất
                </a>
            </div>
        </div>
    </div>
</header>
