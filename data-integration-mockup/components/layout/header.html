<header id="app-header-inner"
        class="w-full text-white relative z-30 select-none"
        style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 60%, #1E3A5F 100%);">

  <div class="px-5 py-0 flex items-center justify-between h-[64px] gap-4">

    <!-- LEFT: Logo + Brand -->
    <div class="flex items-center gap-3 flex-shrink-0">
      <!-- Logo mark -->
      <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
           style="background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); box-shadow: 0 2px 8px rgba(59,130,246,0.4);">
        <i data-lucide="network" class="w-5 h-5 text-white"></i>
      </div>

      <!-- Brand text -->
      <div class="flex flex-col leading-tight">
        <span class="font-bold text-[15px] tracking-tight text-white leading-none">
          Quản trị Tích hợp Dữ liệu
        </span>
        <span class="text-[11px] text-slate-400 mt-0.5 font-medium">Cơ quan ABC · 2026</span>
      </div>

      <!-- Environment badge -->
      <span class="hidden md:inline-flex items-center gap-1.5 ml-3 px-2.5 py-1 rounded-full text-[11px] font-semibold border"
            style="background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.3); color: #34D399;">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Production
      </span>
    </div>

    <!-- CENTER: Nav pills (optional quick links) -->
    <nav class="hidden lg:flex items-center gap-1">
      <a href="#" class="px-3 py-1.5 rounded-lg text-[13px] text-slate-300 hover:text-white hover:bg-white/10 transition-all font-medium">
        Tổng quan
      </a>
      <a href="#" class="px-3 py-1.5 rounded-lg text-[13px] text-slate-300 hover:text-white hover:bg-white/10 transition-all font-medium">
        Vận hành
      </a>
      <a href="#" class="px-3 py-1.5 rounded-lg text-[13px] text-slate-300 hover:text-white hover:bg-white/10 transition-all font-medium">
        Giám sát
      </a>
    </nav>

    <!-- RIGHT: Actions + User -->
    <div class="flex items-center gap-2 flex-shrink-0">

      <!-- Search trigger -->
      <button class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg text-[13px] text-slate-400 border border-white/10 hover:bg-white/10 hover:text-white transition-all"
              title="Tìm kiếm (Ctrl+K)">
        <i data-lucide="search" class="w-3.5 h-3.5"></i>
        <span>Tìm kiếm...</span>
        <kbd class="ml-2 px-1.5 py-0.5 bg-white/10 text-[10px] rounded text-slate-500">Ctrl K</kbd>
      </button>

      <!-- Notification -->
      <button class="relative p-2 rounded-lg hover:bg-white/10 transition-all text-slate-400 hover:text-white" title="Thông báo">
        <i data-lucide="bell" class="w-4.5 h-4.5"></i>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-blue-500 rounded-full border border-slate-900"></span>
      </button>

      <!-- Divider -->
      <div class="w-px h-6 bg-white/10 mx-1"></div>

      <!-- User Dropdown -->
      <div class="relative" id="hdr-user-area">
        <button id="hdr-user-btn"
                class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg hover:bg-white/10 transition-all group"
                aria-haspopup="true" aria-expanded="false">
          <!-- Avatar -->
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
               style="background: linear-gradient(135deg, #3B82F6, #1D4ED8);">
            AD
          </div>
          <!-- Name -->
          <div class="hidden sm:flex flex-col items-start leading-tight">
            <span class="text-[13px] font-semibold text-white">Admin User</span>
            <span class="text-[11px] text-slate-400">Quản trị viên</span>
          </div>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 transition-transform"></i>
        </button>

        <!-- Dropdown -->
        <div id="hdr-user-menu"
             class="hidden absolute right-0 mt-2 w-56 rounded-xl shadow-2xl z-50 overflow-hidden border border-white/10"
             style="background: #1E293B;">
          <!-- User info -->
          <div class="px-4 py-3 border-b border-white/10">
            <p class="text-[11px] text-slate-500">Đang đăng nhập</p>
            <p class="text-sm font-semibold text-white mt-0.5">admin@abc.gov.vn</p>
            <span class="inline-block mt-1.5 px-2 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] font-bold rounded-full border border-blue-500/30">Quản trị viên</span>
          </div>
          <!-- Menu items -->
          <div class="py-1">
            <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-slate-300 hover:bg-white/10 hover:text-white transition-colors">
              <i data-lucide="user" class="w-4 h-4 text-slate-500"></i>Hồ sơ cá nhân
            </a>
            <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-slate-300 hover:bg-white/10 hover:text-white transition-colors">
              <i data-lucide="settings" class="w-4 h-4 text-slate-500"></i>Cài đặt tài khoản
            </a>
            <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-slate-300 hover:bg-white/10 hover:text-white transition-colors">
              <i data-lucide="book-open" class="w-4 h-4 text-slate-500"></i>Tài liệu hướng dẫn
            </a>
          </div>
          <div class="py-1 border-t border-white/10">
            <a href="#" class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors font-medium">
              <i data-lucide="log-out" class="w-4 h-4"></i>Đăng xuất
            </a>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom highlight line -->
  <div class="absolute bottom-0 left-0 right-0 h-px"
       style="background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), transparent);"></div>
</header>

<script>
  (function() {
    const btn  = document.getElementById('hdr-user-btn');
    const menu = document.getElementById('hdr-user-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const open = !menu.classList.contains('hidden');
      menu.classList.toggle('hidden');
      btn.setAttribute('aria-expanded', String(!open));
      const chevron = btn.querySelector('[data-lucide="chevron-down"]');
      if (chevron) chevron.style.transform = open ? '' : 'rotate(180deg)';
    });
    document.addEventListener('click', function() {
      menu.classList.add('hidden');
      btn.setAttribute('aria-expanded', 'false');
      const chevron = btn.querySelector('[data-lucide="chevron-down"]');
      if (chevron) chevron.style.transform = '';
    });
  })();
</script>
